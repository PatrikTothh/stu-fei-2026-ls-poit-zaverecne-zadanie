<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <title>POIT - PID Monitor</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background-color: #f4f4f4;
      }
      .card {
        background: white;
        border-radius: 10px;
        padding: 20px;
        margin: 20px auto;
        width: 300px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .value {
        font-size: 24px;
        font-weight: bold;
        color: #007bff;
      }
      .label {
        color: #666;
        font-size: 14px;
      }
      .log-container {
        background: white;
        border-radius: 10px;
        padding: 20px;
        margin: 20px auto;
        width: 80%;
        max-width: 650px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-height: 300px;
        overflow-y: auto; /* Pridá scrollbar po 300px */
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        border-bottom: 1px solid #ddd;
        padding: 8px;
        text-align: center;
      }
      th {
        background-color: #f8f9fa;
        position: sticky;
        top: 0;
      }
    </style>
  </head>
  <body>
    <h1>PID Regulácia Intenzity Svetla</h1>

    <div class="card" style="width: 80%; max-width: 650px">
      <div id="connection-status" style="color: red; font-weight: bold">
        STAV: ODPOJENÉ
      </div>
      <br />
      <button id="openBtn" class="btn-start" onclick="openConnection()">
        OPEN (Inicializácia)
      </button>
      <button
        id="closeBtn"
        class="btn-stop"
        onclick="closeConnection()"
        disabled
      >
        CLOSE (Ukončenie)
      </button>
    </div>
    <div class="card">
      <h3>Nastavenie</h3>
      <input type="number" id="intenzita" value="100" min="0" max="1000" />
      <button onclick="poslatUdaje()">Nastaviť Luxy</button>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn-start" onclick="startMonitoring()">
        START
      </button>
      <button id="stopBtn" class="btn-stop" onclick="stopMonitoring()" disabled>
        STOP
      </button>
    </div>

    <div style="display: flex; justify-content: center; gap: 20px">
      <div class="card">
        <div class="label">Žiadaná hodnota (Setpoint)</div>
        <div id="val-setpoint" class="value">0</div>
        <div class="label">Lux</div>
      </div>
      <div class="card">
        <div class="label">Aktuálna intenzita (Input)</div>
        <div id="val-input" class="value">0</div>
        <div class="label">Lux</div>
      </div>
      <div class="card">
        <div class="label">Výkon LED (Output)</div>
        <div id="val-output" class="value">0</div>
        <div class="label">PWM (0-255)</div>
      </div>
    </div>

    <div class="log-container">
      <h3>História meraní</h3>
      <table>
        <thead>
          <tr>
            <th>Čas</th>
            <th>Setpoint [lx]</th>
            <th>Input [lx]</th>
            <th>Output [PWM]</th>
          </tr>
        </thead>
        <tbody id="log-table-body">
          <!-- Sem sa budú dopĺňať riadky -->
        </tbody>
      </table>
    </div>

    <script>
      function openConnection() {
        fetch("/open_connection", { method: "POST" })
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "connected") {
              document.getElementById("connection-status").innerText =
                "STAV: PRIPOJENÉ (Inicializované)";
              document.getElementById("connection-status").style.color =
                "green";

              // Aktivujeme ostatné ovládacie prvky
              document.getElementById("openBtn").disabled = true;
              document.getElementById("closeBtn").disabled = false;
              document.getElementById("startBtn").disabled = false;
              // Tu môžeš povoliť aj input pre Luxy
            } else {
              alert("Chyba: " + data.msg);
            }
          });
      }

      function closeConnection() {
        fetch("/close_connection", { method: "POST" })
          .then((response) => response.json())
          .then((data) => {
            location.reload(); // Najjednoduchší spôsob ako resetovať web do východiskového stavu
          });
      }
      // Funkcia na odoslanie nového Setpointu
      function poslatUdaje() {
        const val = document.getElementById("intenzita").value;
        let formData = new FormData();
        formData.append("intenzita", val);
        fetch("/set_led", { method: "POST", body: formData });
      }

      let isRunning = false;

      function startMonitoring() {
        fetch("/start_monitoring", { method: "POST" }).then(() => {
          isRunning = true;
          document.getElementById("startBtn").disabled = true;
          document.getElementById("stopBtn").disabled = false;
        });
      }

      function stopMonitoring() {
        fetch("/stop_monitoring", { method: "POST" }).then(() => {
          isRunning = false;
          document.getElementById("startBtn").disabled = false;
          document.getElementById("stopBtn").disabled = true;
        });
      }

      setInterval(() => {
        fetch("/get_data")
          .then((response) => response.json())
          .then((data) => {
            // Aktualizácia veľkých čísel v kartách
            document.getElementById("val-setpoint").innerText = data.setpoint;
            document.getElementById("val-input").innerText = data.input;
            document.getElementById("val-output").innerText = data.output;

            // PRIDÁVANIE DO ZOZNAMU (iba ak beží monitoring)
            if (isRunning && data.setpoint !== "---") {
              const tableBody = document.getElementById("log-table-body");
              const now = new Date().toLocaleTimeString(); // Aktuálny čas

              // Vytvoríme nový riadok
              const newRow = `<tr>
                        <td>${now}</td>
                        <td>${data.setpoint}</td>
                        <td>${data.input}</td>
                        <td>${data.output}</td>
                    </tr>`;

              // Pridáme riadok na ZAČIATOK tabuľky (nové hore)
              tableBody.insertAdjacentHTML("afterbegin", newRow);

              // Voliteľné: Ak je riadkov priveľa (napr. 50), najstarší vymažeme
              if (tableBody.rows.length > 50) {
                tableBody.deleteRow(tableBody.rows.length - 1);
              }
            }
          });
      }, 1000);
    </script>
  </body>
</html>
